project:
  name: airletters-cnn-bilstm-digits
  seed: 42

paths:
  dataset_root: .
  videos_dir: videos
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  checkpoints_dir: checkpoints
  logs_dir: logs
  outputs_dir: outputs

data:
  # Only train/evaluate on the 10 digit classes (0-9)
  class_filter: digits
  # num_classes is auto-derived from the dataset's label_to_index at runtime;
  # this value is only used as a fallback if class_filter is not set.
  num_classes: 10
  video:
    num_frames: 32
    image_size: 224
    resize_short_edge: 256
    sampling_strategy: uniform
    train_crop_scale: [0.7, 1.0]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  subset:
    enabled: true
    seed: 42
    train:
      samples_per_class: 200   # 1000 train videos total (was 25)
    val:
      samples_per_class: 40    # 200 val videos total (was 5)
    test:
      samples_per_class: 40    # 200 test videos total (was 5)

training:
  device: cuda
  epochs: 20
  batch_size: 4              # lowered from 8 to fit 6GB GPU with 32 frames
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.1
  mixed_precision: true
  grad_clip_norm: 5.0
  log_every_n_steps: 10
  save_best_metric: val_accuracy

evaluation:
  batch_size: 2
  num_workers: 0

model:
  name: cnn_bilstm
  frame_encoder: resnet18
  pretrained: true             # ImageNet init — crucial for fast convergence
  freeze_frame_encoder: false
  lstm_hidden_size: 256
  lstm_num_layers: 2
  dropout: 0.5
  bidirectional: true
