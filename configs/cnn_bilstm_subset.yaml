project:
  name: airletters-cnn-bilstm-subset
  seed: 42

paths:
  dataset_root: .
  videos_dir: videos
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  checkpoints_dir: checkpoints
  logs_dir: logs
  outputs_dir: outputs

data:
  num_classes: 38
  video:
    num_frames: 16
    image_size: 112
    resize_short_edge: 128
    sampling_strategy: uniform
    train_crop_scale: [0.7, 1.0]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  subset:
    enabled: true
    seed: 42
    train:
      samples_per_class: 25
    val:
      samples_per_class: 5
    test:
      samples_per_class: 5

training:
  device: cuda
  epochs: 15
  batch_size: 8
  num_workers: 0
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  label_smoothing: 0.1
  mixed_precision: true
  grad_clip_norm: 5.0
  log_every_n_steps: 10
  save_best_metric: val_accuracy

evaluation:
  batch_size: 8
  num_workers: 0

model:
  name: cnn_bilstm
  frame_encoder: resnet50
  pretrained: true             # ImageNet init for faster convergence
  freeze_frame_encoder: false
  lstm_hidden_size: 256
  lstm_num_layers: 1
  dropout: 0.3
  bidirectional: true

