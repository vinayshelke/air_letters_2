project:
  name: airletters-gesture-recognition
  seed: 42

paths:
  dataset_root: .
  videos_dir: videos
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  checkpoints_dir: checkpoints
  logs_dir: logs
  outputs_dir: outputs

data:
  num_classes: 38
  video:
    num_frames: 16
    image_size: 112
    resize_short_edge: 128
    sampling_strategy: uniform
    train_crop_scale: [0.7, 1.0]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  subset:
    enabled: false

training:
  device: cuda
  epochs: 20
  batch_size: 4
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  label_smoothing: 0.0
  mixed_precision: true
  grad_clip_norm: 5.0
  log_every_n_steps: 50
  save_best_metric: val_accuracy

evaluation:
  batch_size: 4
  num_workers: 0

model:
  name: cnn_bilstm
  frame_encoder: resnet18
  pretrained: false
  freeze_frame_encoder: false
  lstm_hidden_size: 256
  lstm_num_layers: 1
  dropout: 0.3
  bidirectional: true
