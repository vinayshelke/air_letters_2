# ==============================================================================
# Configuration for AirLetters EfficientNet-B0+BiLSTM model - DIGITS & SPECIAL Task (12 Classes)
# ==============================================================================

project:
  name: airletters-efficientnetb0-bilstm-digits-special
  seed: 42                       # Random seed for reproducibility

paths:
  dataset_root: .
  videos_dir: videos
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  checkpoints_dir: checkpoints
  logs_dir: logs
  outputs_dir: outputs

data:
  # Filter the dataset for specific classes (presets: 'digits', 'digits_with_special', 'letters', 'letters_with_special', 'all')
  class_filter: digits_with_special
  num_classes: 12                # 10 digits + 2 specials (Doing nothing & Doing Other Things)

  video:
    num_frames: 32             # Number of frames to sample from each video (48 is safe with EfficientNet-B0)
    image_size: 224              # Height/width to resize frames to for the CNN
    resize_short_edge: 256       # Resize short edge of frames before cropping
    sampling_strategy: motion    # Sampling method: 'uniform' or 'motion' (motion-based action density)
    train_crop_scale: [0.7, 1.0] # Scale range for random spatial cropping during training
    mean: [0.485, 0.456, 0.406]  # ImageNet normalization mean (RGB)
    std: [0.229, 0.224, 0.225]   # ImageNet normalization std (RGB)

  subset:
    enabled: true                # Enable subset training to reduce memory/compute
    seed: 42
    train:
      samples_per_class: 200     # Total train samples per class (12 * 400 = 4,800 videos)
    val:
      samples_per_class: 40      # Total val samples per class (12 * 80 = 960 videos)
    test:
      samples_per_class: 40      # Total test samples per class (12 * 80 = 960 videos)

training:
  device: cuda                   # 'cuda' (GPU) or 'cpu'
  epochs: 30                     # Total training epochs
  batch_size: 4                  # Batch size per step (EfficientNet-B0 is lightweight; 4 is comfortable on 6GB GPU)
  num_workers: 4                 # Number of data loader CPU worker processes
  optimizer: adamw               # Optimizer: 'adam' or 'adamw'
  learning_rate: 0.0001          # Initial learning rate
  weight_decay: 0.0001           # Weight decay regularization
  label_smoothing: 0.1           # Softens target labels to prevent overconfidence/overfitting
  mixed_precision: true          # Use FP16 Automatic Mixed Precision (AMP) to save VRAM
  grad_clip_norm: 5.0            # Max norm value for gradient clipping
  scheduler: cosine              # LR scheduler: 'cosine' (decays LR smoothly to eta_min) or 'none'
  log_every_n_steps: 10          # How often to log training batch metrics
  save_best_metric: val_accuracy # Metric used to save 'best.pt' checkpoint

evaluation:
  batch_size: 4                  # Evaluation batch size (EfficientNet-B0 with 48 frames fits easily on 6GB GPU)
  num_workers: 2                 # Data loader worker processes for evaluation

model:
  name: cnn_bilstm
  frame_encoder: efficientnet_b0  # CNN backbone for frame feature extraction (EfficientNet-B0, feature_dim=1280)
  pretrained: true               # Load ImageNet weights for the CNN backbone
  freeze_frame_encoder: false    # Set to true to freeze CNN layers and only train LSTM
  lstm_hidden_size: 256          # Hidden dimension size of LSTM layers
  lstm_num_layers: 2             # Number of stacked BiLSTM layers
  dropout: 0.5                   # Dropout probability between LSTM layers and classification head
  bidirectional: true            # Process video sequence in both forward and backward time
