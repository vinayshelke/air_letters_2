project:
  name: airletters-mediapipe-transformer-digits
  seed: 42

paths:
  dataset_root: .
  videos_dir: videos
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  checkpoints_dir: checkpoints/mediapipe_transformer
  logs_dir: logs/mediapipe_transformer
  outputs_dir: outputs/mediapipe_transformer

data:
  # Only train/evaluate on the 10 digit classes (0-9)
  class_filter: digits
  # num_classes is auto-derived from label_to_index at runtime
  num_classes: 10

  landmarks:
    num_frames: 32          # must match extraction settings
    image_size: 224         # frame size used during offline extraction
    cache_dir: landmarks_cache

  subset:
    enabled: true
    seed: 42
    train:
      samples_per_class: 100   # 1 000 train videos
    val:
      samples_per_class: 20    # 200 val videos
    test:
      samples_per_class: 20    # 200 test videos

training:
  device: cuda
  epochs: 30
  batch_size: 32             # no CNN backbone — much larger batches fit easily
  num_workers: 0
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  mixed_precision: true
  grad_clip_norm: 1.0        # tighter clip for transformers
  log_every_n_steps: 10
  save_best_metric: val_accuracy

evaluation:
  batch_size: 64
  num_workers: 0

model:
  name: mediapipe_transformer
  input_dim: 63              # 21 landmarks × (x, y, z)
  d_model: 128
  nhead: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 32            # must be >= landmarks.num_frames
